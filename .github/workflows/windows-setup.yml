# Builds the Windows setup (Dokumenten-Anonymisierer-Setup.exe) and tests it
# on a fresh Windows machine: install without admin rights, self-check,
# anonymise test PDFs, start/stop, update, uninstall.
name: Windows-Setup

on:
  push:
    paths:
      - "doc_anonymizer/**"
      - "installer/**"
      - "tests/**"
      - "requirements.txt"
      - "ANLEITUNG.txt"
      - ".github/workflows/windows-setup.yml"
  workflow_dispatch:

concurrency:
  group: windows-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Cache downloads (Python, Tesseract, Sprachmodell)
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('installer/build_windows.ps1') }}

      - name: Werkzeuge
        run: |
          python -m pip install --disable-pip-version-check pillow pymupdf faker regex
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Programmordner und Setup.exe bauen
        run: ./installer/build_windows.ps1

      - name: Setup testen (installieren, prüfen, anonymisieren, deinstallieren)
        run: ./installer/test_setup.ps1

      - name: Größe und Prüfsumme
        run: |
          $setup = Get-Item dist/Dokumenten-Anonymisierer-Setup.exe
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "### Dokumenten-Anonymisierer-Setup.exe`n`n* Größe: $([math]::Round($setup.Length / 1MB)) MB`n* SHA-256: ``$hash``" |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Setup.exe als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Dokumenten-Anonymisierer-Setup
          path: |
            dist/Dokumenten-Anonymisierer-Setup.exe
            dist/Dokumenten-Anonymisierer-Setup.exe.sha256
            ANLEITUNG.txt
          compression-level: 0
          retention-days: 90

      - name: Protokolle bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protokolle
          path: |
            build/testlogs
            ~/AppData/Local/DocAnonymizer/logs
          if-no-files-found: ignore

  tests-windows:
    # The test suite on Windows (paths, file locks, process start differ).
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
          python -m spacy download de_core_news_lg
          choco install tesseract -y --no-progress
          python -m doc_anonymizer.setup_helper tessdata
      - name: Tests
        env:
          TESSERACT_CMD: C:\Program Files\Tesseract-OCR\tesseract.exe
        run: |
          $env:Path += ";C:\Program Files\Tesseract-OCR"
          python -m pytest -q

# Builds the Windows setup (Dokumenten-Anonymisierer-Setup.exe) and tests it
# on a fresh Windows machine: install without admin rights, self-check,
# anonymise test PDFs, start/stop, update, uninstall.
name: Windows-Setup

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "doc_anonymizer/**"
      - "installer/**"
      - "tests/**"
      - "requirements.txt"
      - "ANLEITUNG.txt"
      - ".github/workflows/windows-setup.yml"
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: "Als Release veröffentlichen (Download-Adresse der PowerShell-Zeile)"
        type: boolean
        default: false

# Building and testing only reads the repository; the release job below asks
# for write access on its own.
permissions:
  contents: read

concurrency:
  group: windows-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Cache downloads (Python, Tesseract, Sprachmodell)
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('installer/build_windows.ps1') }}

      - name: Werkzeuge
        run: |
          python -m pip install --disable-pip-version-check pillow pymupdf faker regex
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Programmordner und Setup.exe bauen
        run: ./installer/build_windows.ps1

      - name: Setup testen (installieren, prüfen, anonymisieren, deinstallieren)
        run: ./installer/test_setup.ps1

      - name: Größe und Prüfsumme
        run: |
          $setup = Get-Item dist/Dokumenten-Anonymisierer-Setup.exe
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "### Dokumenten-Anonymisierer-Setup.exe`n`n* Größe: $([math]::Round($setup.Length / 1MB)) MB`n* SHA-256: ``$hash``" |
            Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Setup.exe als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Dokumenten-Anonymisierer-Setup
          path: |
            dist/Dokumenten-Anonymisierer-Setup.exe
            dist/Dokumenten-Anonymisierer-Setup.exe.sha256
            ANLEITUNG.txt
          compression-level: 0
          retention-days: 90

      - name: Protokolle bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protokolle
          path: |
            build/testlogs
            ~/AppData/Local/DocAnonymizer/logs
          if-no-files-found: ignore

  tests-windows:
    # The test suite on Windows (paths, file locks, process start differ).
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
          python -m spacy download de_core_news_lg
          choco install tesseract -y --no-progress
          python -m doc_anonymizer.setup_helper tessdata
      - name: Tests
        env:
          TESSERACT_CMD: C:\Program Files\Tesseract-OCR\tesseract.exe
        run: |
          $env:Path += ";C:\Program Files\Tesseract-OCR"
          python -m pytest -q

  release:
    # Publishes the tested setup as a GitHub release - the address the
    # one-line installation (installer/install.ps1) downloads from. Only on
    # purpose: for a version tag (v1.2.3) or a manual start with the checkbox.
    # A published version is never replaced: a changed setup needs a new
    # version number (doc_anonymizer/__init__.py).
    needs: [setup, tests-windows]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Dokumenten-Anonymisierer-Setup
          path: release
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' doc_anonymizer/__init__.py)"
          tag="v${version}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zur Programmversion ${version}."
            exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::Release ${tag} gibt es bereits. Bitte die Versionsnummer erhöhen."
            exit 1
          fi
          # The checksum file was written on Windows (line ends with CR LF).
          setup="$(find release -name Dokumenten-Anonymisierer-Setup.exe -print -quit)"
          expected="$(tr -d '\r' < "${setup}.sha256" | cut -d' ' -f1)"
          actual="$(sha256sum "${setup}" | cut -d' ' -f1)"
          if [[ -z "${expected}" || "${expected}" != "${actual}" ]]; then
            echo "::error::Die Prüfsumme der Setup.exe stimmt nicht mit der gebauten Datei überein."
            exit 1
          fi
          {
            echo "Einrichtung unter Windows 10/11 - eine Zeile in PowerShell (Startmenü → „PowerShell“):"
            echo
            echo '```'
            echo "irm https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.ps1 | iex"
            echo '```'
            echo
            echo "Oder \`Dokumenten-Anonymisierer-Setup.exe\` herunterladen und doppelklicken (siehe ANLEITUNG.txt)."
            echo
            echo "SHA-256 der Setup.exe: \`${actual}\`"
          } > notes.md
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "Dokumenten-Anonymisierer ${version}" \
            --notes-file notes.md --latest \
            "${setup}" "${setup}.sha256" installer/install.ps1 ANLEITUNG.txt

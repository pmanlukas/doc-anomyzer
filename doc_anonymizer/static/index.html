<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dokumenten-Anonymisierer</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" title="Zur Startseite">
      <img src="/static/icon.svg" alt="" width="30" height="30">
      <span>Dokumenten-Anonymisierer</span>
    </a>
    <span class="badge-local" title="Alle Dokumente werden ausschließlich auf diesem Computer verarbeitet. Es wird nichts ins Internet übertragen.">
      <span id="ico-lock"></span> Alles bleibt auf diesem Computer
    </span>
    <span class="spacer"></span>
    <button class="btn ghost" id="btn-help" type="button">Hilfe</button>
    <button class="btn ghost" id="btn-settings" type="button">Einstellungen</button>
    <button class="btn ghost" id="btn-quit" type="button" hidden title="Programm beenden (Ihre Akten bleiben gespeichert)">Beenden</button>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="actionbar-root"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status"></div>
  <noscript><p class="noscript">Dieses Programm benötigt JavaScript im Browser.</p></noscript>

  <script src="/static/app.js"></script>
</body>
</html>
